<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Students - Student Management System</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <aside class="sidebar">

            <h2>StudentMS</h2>

            <nav>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="add-student.html">
                    Add Student
                </a>

                <a href="students.html">
                    View Students
                </a>
<a href="logout">
    Logout
</a>
            </nav>

        </aside>


        <!-- Main Content -->

        <main class="main-content">

            <header>

                <h1>Students</h1>

                <p>
                    View and manage all students.
                </p>

            </header>


            <!-- Success / Error Message -->

            <div id="message"
                 class="message"
                 style="display: none;">
            </div>


            <!-- Search -->

            <div class="search-container">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by name, course, email or ID..."
                >

            </div>


            <!-- Student Table -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Age</th>

                            <th>Course</th>

                            <th>Email</th>

                            <th>Gender</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="studentTableBody">

                    </tbody>

                </table>

            </div>

        </main>

    </div>


    <script>

        let allStudents = [];


        // =========================
        // LOAD STUDENTS
        // =========================

        function loadStudents() {

            fetch("students")

                .then(function(response) {

                    if (!response.ok) {

                        throw new Error(
                            "Server returned status: "
                            + response.status
                        );

                    }

                    return response.json();

                })

                .then(function(students) {

                    allStudents = students;

                    displayStudents(
                        allStudents
                    );

                })

                .catch(function(error) {

                    console.error(
                        "Error loading students:",
                        error
                    );

                    showMessage(
                        "Unable to load students.",
                        "error"
                    );

                });

        }


        // =========================
        // DISPLAY STUDENTS
        // =========================

        function displayStudents(students) {

            const tableBody =
                document.getElementById(
                    "studentTableBody"
                );

            tableBody.innerHTML = "";


            if (students.length === 0) {

                const row =
                    document.createElement("tr");

                row.innerHTML = `
                    <td colspan="7"
                        style="text-align: center;">
                        No students found.
                    </td>
                `;

                tableBody.appendChild(row);

                return;
            }


            students.forEach(function(student) {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${student.id}
                    </td>

                    <td>
                        ${student.name}
                    </td>

                    <td>
                        ${student.age}
                    </td>

                    <td>
                        ${student.course}
                    </td>

                    <td>
                        ${student.email}
                    </td>

                    <td>
                        ${student.gender || ""}
                    </td>

                    <td>

                        <a
                            href="edit-student.html?id=${student.id}"
                            class="edit-btn"
                        >
                            Edit
                        </a>


                        <button
                            class="delete-btn"
                            onclick="deleteStudent(${student.id})"
                        >
                            Delete
                        </button>

                    </td>

                `;


                tableBody.appendChild(row);

            });

        }


        // =========================
        // SEARCH
        // =========================

        document.getElementById(
            "searchInput"
        ).addEventListener(
            "input",
            function() {

                const searchText =
                    this.value
                        .toLowerCase()
                        .trim();


                const filteredStudents =
                    allStudents.filter(
                        function(student) {

                            return (

                                String(student.id)
                                    .toLowerCase()
                                    .includes(searchText)

                                ||

                                student.name
                                    .toLowerCase()
                                    .includes(searchText)

                                ||

                                student.course
                                    .toLowerCase()
                                    .includes(searchText)

                                ||

                                student.email
                                    .toLowerCase()
                                    .includes(searchText)

                                ||

                                String(student.age)
                                    .toLowerCase()
                                    .includes(searchText)

                                ||

                                String(student.gender)
                                    .toLowerCase()
                                    .includes(searchText)

                            );

                        }
                    );


                displayStudents(
                    filteredStudents
                );

            }
        );


        // =========================
        // DELETE STUDENT
        // =========================

        function deleteStudent(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete student "
                    + id
                    + "?"
                );


            if (!confirmed) {

                return;

            }


            fetch("deleteStudent", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/x-www-form-urlencoded"

                },

                body:
                    "id=" +
                    encodeURIComponent(id)

            })

            .then(function(response) {

                return response.text()

                    .then(function(message) {

                        if (!response.ok) {

                            throw new Error(
                                message
                            );

                        }

                        return message;

                    });

            })


            .then(function(message) {

                showMessage(
                    message,
                    "success"
                );


                // Reload table

                loadStudents();

            })


            .catch(function(error) {

                console.error(
                    "Delete error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to delete student.",
                    "error"
                );

            });

        }


        // =========================
        // SHOW MESSAGE
        // =========================

        function showMessage(
            text,
            type
        ) {

            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                text;


            message.className =
                "message " + type;


            message.style.display =
                "block";


            // Automatically hide after 3 seconds

            setTimeout(function() {

                message.style.display =
                    "none";

            }, 3000);

        }


        // =========================
        // INITIAL LOAD
        // =========================

        loadStudents();

    </script>

</body>

</html>
