<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Dashboard - Student Management System
    </title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <div class="dashboard">


        <!-- Sidebar -->

        <aside class="sidebar">

            <h2>StudentMS</h2>

            <nav>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="add-student.html">
                    Add Student
                </a>

                <a href="students.html">
                    View Students
                </a>
<a href="logout">
    Logout
</a>
            </nav>

        </aside>


        <!-- Main Content -->

        <main class="main-content">


            <header>

                <h1>
                    Dashboard
                </h1>

                <p>
                    Welcome to Student Management System
                </p>

            </header>


            <!-- Statistics Cards -->

            <section class="cards">


                <div class="card">

                    <h3>
                        Total Students
                    </h3>

                    <p id="totalStudents">
                        0
                    </p>

                </div>


                <div class="card">

                    <h3>
                        Courses
                    </h3>

                    <p id="totalCourses">
                        0
                    </p>

                </div>


                <div class="card">

                    <h3>
                        Active Students
                    </h3>

                    <p id="activeStudents">
                        0
                    </p>

                </div>


            </section>


            <!-- Quick Actions -->

            <section class="quick-actions">

                <h2>
                    Quick Actions
                </h2>


                <div class="actions">

                    <a href="add-student.html">
                        Add New Student
                    </a>

                    <a href="students.html">
                        View All Students
                    </a>

                </div>

            </section>


        </main>

    </div>


    <!-- Dashboard JavaScript -->

    <script>

        function loadDashboard() {


            fetch("dashboard")

                .then(function(response) {

                    if (!response.ok) {

                        throw new Error(
                            "Server error: "
                            + response.status
                        );

                    }

                    return response.json();

                })


                .then(function(data) {


                    console.log(
                        "Dashboard data:",
                        data
                    );


                    document.getElementById(
                        "totalStudents"
                    ).textContent =
                        data.totalStudents;


                    document.getElementById(
                        "totalCourses"
                    ).textContent =
                        data.totalCourses;


                    document.getElementById(
                        "activeStudents"
                    ).textContent =
                        data.activeStudents;

                })


                .catch(function(error) {

                    console.error(
                        "Error loading dashboard:",
                        error
                    );

                });

        }


        loadDashboard();

    </script>


</body>

</html>
